<div class="ui-field-shortcuts" role="group" aria-label="{{ group_label }} para {{ field.label|lower }}">{% if show_label %}<span class="ui-field-shortcuts-label" aria-hidden="true">{{ group_label }}:</span>{% endif %}{% for snippet in snippets %}<button class="ui-button ui-button-outlined" type="button" data-insert-into="{{ field.id_for_label }}" data-insert-mode="{{ snippet.mode }}" data-text="{{ snippet.text }}"{% if snippet.mode == "line" %} aria-pressed="false"{% endif %}>{{ snippet.label }}</button>{% endfor %}</div>
