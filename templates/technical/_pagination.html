{% load ui %}{% if page_obj.paginator.num_pages > 1 %}
<nav class="ui-pagination" aria-label="Páginas">
    {% if page_obj.has_previous %}<a class="ui-button ui-button-outlined" href="?page={{ page_obj.previous_page_number }}&amp;q={{ query|urlencode }}&amp;role={{ role_filter|urlencode }}&amp;status={{ status_filter|urlencode }}&amp;action={{ action_filter|urlencode }}">{% ui_icon "back" %}Anterior</a>{% endif %}
    <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}<a class="ui-button ui-button-outlined" href="?page={{ page_obj.next_page_number }}&amp;q={{ query|urlencode }}&amp;role={{ role_filter|urlencode }}&amp;status={{ status_filter|urlencode }}&amp;action={{ action_filter|urlencode }}">Siguiente{% ui_icon "forward" %}</a>{% endif %}
</nav>
{% endif %}
