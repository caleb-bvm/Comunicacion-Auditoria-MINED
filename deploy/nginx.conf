# Instalar dentro de http {} (por ejemplo, /etc/nginx/conf.d/endpoint.conf).
# Sustituir auditoria.example.org y las rutas del certificado.
limit_req_zone $binary_remote_addr zone=endpoint_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=endpoint_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=endpoint_connections:10m;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name auditoria.example.org;
    return 301 https://auditoria.example.org$request_uri;
}

server {
    listen 443 ssl;
    server_name auditoria.example.org;
    ssl_certificate /etc/letsencrypt/live/auditoria.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auditoria.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    if ($host != auditoria.example.org) { return 444; }

    # Admite informe y diez adjuntos de 20 MB; Django limita cada archivo.
    client_max_body_size 225m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn endpoint_connections 10;
    limit_req zone=endpoint_requests burst=30 nodelay;

    # Gunicorn solo escucha localmente. Reemplazar las cabeceras del visitante.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;

    location /static/ {
        alias /srv/endpoint/staticfiles/;
    }
    location /archivos-privados/ { return 404; }
    location /media/ { return 404; }
    location ~ /\. { return 404; }

    location = /ingresar/ {
        limit_req zone=endpoint_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /activar-cuenta/ {
        # Los enlaces incluyen un secreto de un solo uso.
        access_log off;
        limit_req zone=endpoint_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/direccion/centros-educativos/[0-9]+/activar/$ {
        limit_req zone=endpoint_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /administracion/ {
        # Agregar aquí únicamente la red VPN de administración autorizada.
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=endpoint_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
