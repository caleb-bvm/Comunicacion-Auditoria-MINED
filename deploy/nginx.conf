# Instalar dentro de http {} (por ejemplo, /etc/nginx/conf.d/siga-mineducyt.conf).
# install-production.sh sustituye auditoria.example.org y las rutas __SSL_*__ (--cert/--key).
limit_req_zone $binary_remote_addr zone=siga_mineducyt_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=siga_mineducyt_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=siga_mineducyt_connections:10m;

# Dirección que muestran las páginas de error de Nginx: sin parámetros y sin el secreto
# de los enlaces de activación y restablecimiento.
map $request_uri $siga_error_path {
    default "";
    "~^/(?<siga_secret_route>activar-cuenta|restablecer)/" "/$siga_secret_route/[oculto]/";
    "~^(?<siga_plain_path>[^?]*)" $siga_plain_path;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name auditoria.example.org;
    return 301 https://auditoria.example.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name auditoria.example.org;
    ssl_certificate __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:siga_mineducyt_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    if ($host != auditoria.example.org) { return 444; }

    # Admite informe y diez adjuntos de 50 MB; Django limita cada archivo.
    client_max_body_size 600m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn siga_mineducyt_connections 10;
    limit_req zone=siga_mineducyt_requests burst=30 nodelay;

    # Gunicorn solo escucha localmente. Reemplazar las cabeceras del visitante.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    # El antivirus puede tardar varios minutos con un PDF de 50 MB (también al descargar).
    proxy_read_timeout 720s;

    # Errores que genera Nginx cuando la aplicación no responde o no se le consulta. Los de
    # Django (400, 403, 404, 405, 500) los dibuja la aplicación. Ver docs/incident-troubleshooting.md.
    error_page 413 /_errores/413.html;
    error_page 429 /_errores/429.html;
    error_page 502 503 /_errores/502.html;
    error_page 504 /_errores/504.html;
    location ^~ /_errores/ {
        internal;
        alias /srv/siga-mineducyt/deploy/errors/;
        ssi on;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    }

    location /static/ {
        alias /srv/siga-mineducyt/staticfiles/;
        # collectstatic agrega un hash al nombre: el contenido nunca cambia.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        # Nginx solo comprime estáticos. Las páginas las comprime Django, que agrega
        # bytes aleatorios a cada respuesta para mitigar BREACH.
        # install-production.sh deja versiones .gz listas (compress-static.sh);
        # la compresión al vuelo queda para los archivos sin versión .gz.
        gzip_static on;
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml;
    }
    location /archivos-privados/ { return 404; }
    location /media/ { return 404; }
    location ~ /\. { return 404; }

    location = /ingresar/ {
        limit_req zone=siga_mineducyt_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /activar-cuenta/ {
        # Los enlaces incluyen un secreto de un solo uso.
        access_log off;
        limit_req zone=siga_mineducyt_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/direccion/centros-educativos/[0-9]+/activar/$ {
        limit_req zone=siga_mineducyt_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /administracion/ {
        # Agregar aquí únicamente la red VPN de administración autorizada.
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=siga_mineducyt_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
