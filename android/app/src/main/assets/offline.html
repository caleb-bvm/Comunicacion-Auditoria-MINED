<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f7f8fb; color: #191c21; font-family: system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 8px; }
  p { color: #42474f; line-height: 1.5; margin: 0 0 24px; }
  button { background: #1a4d9c; color: #fff; border: 0; border-radius: 999px; padding: 12px 28px;
           font-size: 1rem; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>No se pudo conectar</h1>
  <p>Revise su conexión a internet e intente de nuevo.</p>
  <button type="button" onclick="location.href='siga-app://retry'">Reintentar</button>
</main>
</body>
</html>
